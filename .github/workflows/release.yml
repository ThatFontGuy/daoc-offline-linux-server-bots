name: Build and release

# Builds the portable Linux server and the navmesh archive with the project's own scripts
# (tools/build-release.sh, tools/package-navmeshes.sh), on ubuntu-22.04 to match
# tools/setup-build-box.sh (glibc 2.35, so the result runs on glibc 2.34+ systems).
#
# Push a tag matching v* to build and publish a GitHub Release automatically. Use
# "Run workflow" (workflow_dispatch) to test the build without publishing anything; its
# artifacts are attached to the Actions run instead of a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out (with tags, for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libicu70 cmake g++ make

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build the server release
        run: tools/build-release.sh

      - name: Package the navmesh archive
        run: tools/package-navmeshes.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daoc-server-release
          path: |
            dist/daoc-server-*-linux-x64.tar.gz
            dist/daoc-navmeshes-*.tar.xz
            dist/daoc-navmeshes-*.tar.xz.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/daoc-server-*-linux-x64.tar.gz
            dist/daoc-navmeshes-*.tar.xz
            dist/daoc-navmeshes-*.tar.xz.sha256
